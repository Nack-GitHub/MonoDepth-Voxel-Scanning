experiment: exp2_voxel_size
base: configs/base.yaml
scenes: [42444474]   # add 2 more video_ids once downloaded (data/README.md)
runs:
  - name: v02
    overrides: {depth.source: gt, fusion.voxel_size: 0.02, fusion.sdf_trunc: 0.06}
  - name: v04
    overrides: {depth.source: gt, fusion.voxel_size: 0.04, fusion.sdf_trunc: 0.12}
  - name: v08
    overrides: {depth.source: gt, fusion.voxel_size: 0.08, fusion.sdf_trunc: 0.24}
