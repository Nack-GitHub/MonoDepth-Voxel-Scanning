# Experiment 3 — Frame stride. Answers "how long a video / how much compute per scan".
# Run with the *deployable* mono setting (per_scene), because that's what the business cares about.
experiment: exp3_frame_stride
base: configs/base.yaml
scenes: [41069021, 41159856, 42445173]   # ARKitScenes video_ids WITH highres_depth — replace after download
runs:
  - name: s01
    overrides: {depth.source: mono, depth.model: depth_anything_v2_large, depth.aligner: per_scene, dataset.frame_stride: 1}
  - name: s05
    overrides: {depth.source: mono, depth.model: depth_anything_v2_large, depth.aligner: per_scene, dataset.frame_stride: 5}
  - name: s10
    overrides: {depth.source: mono, depth.model: depth_anything_v2_large, depth.aligner: per_scene, dataset.frame_stride: 10}
  - name: s20
    overrides: {depth.source: mono, depth.model: depth_anything_v2_large, depth.aligner: per_scene, dataset.frame_stride: 20}
