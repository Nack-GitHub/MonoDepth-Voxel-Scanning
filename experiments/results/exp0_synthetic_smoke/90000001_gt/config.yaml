dataset:
  name: arkitscenes
  root: data/synthetic
  scene: 90000001
  frame_stride: 2
  max_frames: null
  options:
    split: Training
    reference: arkit_mesh
    fusion_resolution:
    - 256
    - 192
depth:
  source: gt
  model: null
  aligner: identity
  aligner_fit_frames: 10
  lidar_min_confidence: 0
fusion:
  voxel_size: 0.04
  sdf_trunc: 0.12
  depth_trunc: 5.0
  depth_min: 0.1
postprocess:
  remove_small_clusters: true
  min_cluster_triangles: 1000
  simplify_target_triangles: null
eval:
  fscore_thresholds:
  - 0.02
  - 0.05
  - 0.1
  n_sample_points: 200000
  compute_2d_metrics: true
output:
  root: experiments/results
  experiment: exp0_synthetic_smoke
  run_name: 90000001_gt
  save_mesh: true
  export_formats:
  - ply
runtime:
  device: auto
  seed: 0
