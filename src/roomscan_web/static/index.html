<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>roomscan viewer</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<aside>
  <h1>roomscan</h1>
  <div class="tabs">
    <button type="button" data-tab="scans" class="on">Scans</button>
    <button type="button" data-tab="gallery">Gallery</button>
    <button type="button" id="clear" hidden>clear selection</button>
  </div>
  <section id="tab-scans">
    <form id="up">
      <input type="file" name="file" accept=".zip" required>
      <select name="preset" id="preset"></select>
      <div class="st" id="preset-note"></div>
      <button type="submit">Upload &amp; reconstruct</button>
    </form>
    <ul id="jobs"></ul>
  </section>
  <section id="tab-gallery" hidden>
    <div id="gallery"></div>
  </section>
</aside>
<main>
  <div id="toolbar">
    <span id="color-label">Color:
      <span class="seg" id="color"><button type="button" data-mode="real" class="on">real</button><button type="button" data-mode="error">error</button></span>
    </span>
    <label id="overlay-label"><input type="checkbox" id="overlay"> Faro overlay</label>
    <label title="rotate a Z-up capture (ARKitScenes) upright; ARKit/ARCore app captures are Y-up"><input type="checkbox" id="zup"> Z-up</label>
    <div id="legend" hidden></div>
  </div>
  <div id="banner" hidden>different rooms — not comparable</div>
  <div id="view">
    <div id="cells"></div>
    <div id="hud">open a scan or a gallery run, or compare up to 3 side by side</div>
  </div>
  <div id="metrics" hidden></div>
</main>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module" src="/static/js/main.js"></script>
</body>
</html>
