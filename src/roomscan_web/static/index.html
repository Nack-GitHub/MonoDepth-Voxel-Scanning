<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>roomscan viewer</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<aside>
  <h1>roomscan</h1>
  <form id="up">
    <input type="file" name="file" accept=".zip" required>
    <select name="preset" id="preset"></select>
    <div class="st" id="preset-note"></div>
    <button type="submit">Upload &amp; reconstruct</button>
  </form>
  <label class="st"><input type="checkbox" id="zup"> capture is Z-up (ARKit/ARCore are Y-up: leave off)</label>
  <ul id="jobs"></ul>
</aside>
<div id="view"><div id="hud">select a finished scan</div></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module" src="/static/js/main.js"></script>
</body>
</html>
